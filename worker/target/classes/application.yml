spring:
  application:
    name: variantum-worker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:variantum}
    username: ${DB_USER:variantum}
    password: ${DB_PASSWORD:changeme_strong_password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Своя таблица истории миграций — worker владеет только своими таблицами
  # (worker_export_events, worker_analysis_events) в общей БД, не трогая схему backend.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_worker

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: variantum-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8081

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    ru.variantum.worker: ${LOG_LEVEL_VARIANTUM:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info
